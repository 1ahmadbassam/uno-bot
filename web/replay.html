<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>UNO Replay</title>
<!--
  Turn-by-turn replays of the games the bot logged (rivalry_log.py).
  replay.html#<id> shows games/<id>.json; without an id it lists every replay
  from scores.json. The fairness checker is in fair.js, shared with index.html.
-->
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --raise: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #7c7a74;
  --grid: #e7e6e0; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --wash: rgba(11, 11, 11, 0.045);
  --a: #2a78d6; --b: #eb6834; --good: #006300;
  --card-r: #d7263d; --card-b: #1b62c4; --card-g: #2a9a45; --card-y: #f2c12e; --card-x: #26262a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raise: #222220; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8d86;
    --grid: #2c2c2a; --axis: #45453f; --border: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06);
    --a: #3987e5; --b: #d95926; --good: #0ca30c;
    --card-x: #0a0a0b; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raise: #222220; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8d86;
  --grid: #2c2c2a; --axis: #45453f; --border: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06);
  --a: #3987e5; --b: #d95926; --good: #0ca30c;
  --card-x: #0a0a0b; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: inherit; }
button, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { padding: 20px 0 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
header h1 { font-size: 20px; }
header .sub { color: var(--muted); font-size: 13px; }
.back { font-size: 13px; color: var(--ink2); text-decoration: none; display: inline-block; margin-bottom: 4px; }
.back:hover { color: var(--ink); }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; line-height: 1.3; }
.btn:hover { background: var(--raise); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 13px; min-height: 30px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.grid { display: grid; grid-gap: 14px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); margin-bottom: 14px; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.ch { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 8px; }
.ch h3 { font-size: 14px; margin-right: 8px; }
.cap { color: var(--muted); font-size: 12px; }
.fair { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.fair li { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--grid); }
.fair li:first-child { border-top: 0; }
.fair .mk { flex: none; width: 1.2em; font-weight: 600; }
.fair .ok { color: var(--good); }
.fair .bad { color: #c62828; }
.fair .wait { color: var(--muted); }
.fair .dt { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.verdict-ok { color: var(--good); font-weight: 600; }
details.math { margin-top: 10px; border-top: 1px solid var(--grid); padding-top: 8px; }
details.math summary { cursor: pointer; font-size: 13px; color: var(--ink2); }
details.math .how { color: var(--muted); font-size: 12px; margin: 8px 0; line-height: 1.5; }
details.math .tbl { max-height: 460px; overflow: auto; }
details.math table { font-size: 12px; }
details.math td { vertical-align: middle; white-space: nowrap; }
details.math code { font-size: 11px; }
details.math .rej { color: var(--muted); font-size: 11px; }
details.math .uc { transform: scale(.8); transform-origin: left center; }
.verdict-bad { color: #c62828; font-weight: 600; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.a { background: var(--a); } .sw.b { background: var(--b); }
.summary { display: flex; flex-wrap: wrap; margin: 0 0 14px; }
.summary div { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin: 0 8px 8px 0; }
.summary b { display: block; font-size: 16px; }
.summary span { font-size: 11px; color: var(--muted); }

/* Board */
.board { display: flex; align-items: center; }
.board .top { margin-right: 18px; }
.board .info { font-size: 13px; color: var(--ink2); }
.board .info b { color: var(--ink); font-size: 15px; display: block; margin-bottom: 2px; }
.hand { padding: 10px 0 4px; border-top: 1px solid var(--grid); margin-top: 12px; }
.hand-h { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.hand-h b { font-weight: 600; }
.hand.turn .hand-h b::after { content: " · to play"; color: var(--muted); font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; min-height: 46px; }

/* Cards */
.uc {
  width: 32px; height: 46px; border-radius: 6px; margin: 0 4px 4px 0; display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 14px; position: relative; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85), 0 1px 2px rgba(0, 0, 0, 0.25);
}
.uc.r { background: var(--card-r); } .uc.b { background: var(--card-b); } .uc.g { background: var(--card-g); }
.uc.y { background: var(--card-y); color: #1a1a1a; } .uc.x { background: var(--card-x); }
.uc.x::before {
  content: ""; position: absolute; top: 7px; bottom: 7px; left: 6px; right: 6px; border-radius: 50%; opacity: 0.9;
  background: linear-gradient(135deg, var(--card-r) 25%, var(--card-b) 25% 50%, var(--card-y) 50% 75%, var(--card-g) 75%);
  background: conic-gradient(var(--card-r) 0 25%, var(--card-b) 0 50%, var(--card-y) 0 75%, var(--card-g) 0);
}
.uc.x span { position: relative; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
.uc.big { width: 64px; height: 92px; border-radius: 10px; font-size: 26px; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.9), 0 2px 6px rgba(0, 0, 0, 0.25); }
.uc.big.x::before { top: 14px; bottom: 14px; left: 10px; right: 10px; }
.uc .pick { position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); }
.uc.big .pick { width: 22px; height: 22px; right: -6px; bottom: -6px; }
.uc.new { outline: 2px solid var(--ink); outline-offset: 1px; }
.pick.r { background: var(--card-r); } .pick.b { background: var(--card-b); } .pick.g { background: var(--card-g); } .pick.y { background: var(--card-y); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.controls > * { margin: 0 6px 6px 0; }
input[type="range"] { flex: 1 1 220px; min-width: 160px; accent-color: var(--ink); }
.step { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Timeline */
.timeline { max-height: 520px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -8px; }
.ev { display: flex; align-items: flex-start; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.ev:hover { background: var(--wash); }
.ev.on { background: var(--wash); box-shadow: inset 3px 0 0 var(--ink); }
.ev.future { opacity: 0.45; }
.ev .tm { color: var(--muted); font-size: 11px; width: 44px; flex: none; padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev .tx { flex: 1; min-width: 0; }
.ev .th { color: var(--muted); font-size: 11px; margin-left: 6px; white-space: nowrap; }
.ev .uc { width: 18px; height: 26px; font-size: 10px; border-radius: 4px; margin: 0 2px 0 4px; vertical-align: middle; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.85); }
.ev .uc.x::before { top: 5px; bottom: 5px; left: 3px; right: 3px; }
.tag { display: inline-block; font-size: 10px; border-radius: 999px; padding: 0 6px; margin-left: 4px; border: 1px solid var(--border); color: var(--ink2); vertical-align: 1px; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart svg { display: block; }
.ax text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ax line { stroke: var(--grid); shape-rendering: crispEdges; }
#msg { padding: 60px 0; text-align: center; color: var(--muted); }
#tip { position: fixed; z-index: 50; pointer-events: none; display: none; background: var(--raise); color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16); }
footer { color: var(--muted); font-size: 12px; padding: 24px 0 40px; }
</style>
</head>
<body>
<script>
(function () {
  try {
    var t = localStorage.getItem('rivalry-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="index.html">← All statistics</a>
      <h1 id="title">Replays</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div id="nav-games"></div>
  </header>

  <div id="msg">Loading…</div>

  <div id="list" style="display:none">
    <div class="card"><div class="tbl"><table id="list-table"></table></div></div>
  </div>

  <div id="game" style="display:none">
    <div class="summary" id="summary"></div>
    <div class="grid">
      <div>
        <div class="card">
          <div class="board">
            <div class="top" id="top"></div>
            <div class="info" id="info"></div>
          </div>
          <div class="hand" id="hand-a"></div>
          <div class="hand" id="hand-b"></div>
          <div class="controls">
            <button class="btn" type="button" id="first" title="Start (Home)">⏮</button>
            <button class="btn" type="button" id="prev" title="Previous step (←)">◀</button>
            <button class="btn" type="button" id="play" title="Play or pause (space)">▶ Play</button>
            <button class="btn" type="button" id="next" title="Next step (→)">▶</button>
            <button class="btn" type="button" id="last" title="End (End)">⏭</button>
            <select id="speed" aria-label="Playback speed">
              <option value="1200">Slow</option><option value="650" selected>Normal</option><option value="250">Fast</option>
            </select>
            <input type="range" id="slider" min="0" max="0" value="0" aria-label="Step">
            <span class="step" id="step"></span>
          </div>
        </div>
        <div class="card" style="margin-top:14px">
          <div class="ch"><h3>Cards in hand</h3><span class="cap">Click to jump there</span></div>
          <div class="chart" id="chart"></div>
        </div>
        <div class="card" style="margin-top:14px">
          <div class="ch"><h3>This game</h3></div>
          <div class="tbl"><table id="stats"></table></div>
        </div>
        <div class="card" style="margin-top:14px">
          <div class="ch"><h3>Fairness check</h3><span class="cap" id="fair-cap"></span></div>
          <ul class="fair" id="fair"></ul>
        </div>
      </div>
      <div class="card">
        <div class="ch"><h3>Moves</h3><span class="cap" id="moves-cap"></span></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </div>
  <footer>Hands are rebuilt from the bot's log, so every card each player held is shown. Thinking times leave out the bot's pause before each turn.</footer>
</div>
<div id="tip"></div>

<script src="fair.js"></script>
<script>
(function () {
'use strict';
var COLOR_NAMES = { r: 'red', b: 'blue', g: 'green', y: 'yellow' };
var REASONS = { pen: 'penalty', bluff: 'caught bluffing', chal: 'lost the challenge', time: 'ran out of time' };
var G = null, STATES = [], STEP = 0, TIMER = null, LIST = [];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function nm(p) { return p && G ? esc(G.players[p]) : 'Someone'; }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function clock(ms) { var s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); }
function fmtDur(ms) { var s = Math.round(ms / 1000); return Math.floor(s / 60) + 'm ' + pad(s % 60) + 's'; }
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Times are the viewer's local time, as on the main page
function fmtDate(t, seconds) {
  var d = new Date(t);
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + (seconds ? ':' + pad(d.getSeconds()) : '');
}
function fmtStamp(s) { return s ? fmtDate(Date.parse(s)) : '–'; }
function think(e) { return e.th == null ? null : Math.max(0, e.th - (G.pacing || 0) * 1000) / 1000; }

// --- Cards ------------------------------------------------------------------
function parts(card) {
  if (card === 'draw_four') return { color: 'x', label: '+4' };
  if (card === 'colorchooser') return { color: 'x', label: 'W' };
  var i = card.indexOf('_'), v = card.slice(i + 1);
  return { color: card.slice(0, i), label: { skip: '⊘', reverse: '⇄', draw: '+2' }[v] || v };
}
function chip(card, o) {
  o = o || {};
  var p = parts(card);
  return '<span class="uc ' + p.color + (o.big ? ' big' : '') + (o.fresh ? ' new' : '') + '" title="' + esc(cardName(card)) + '"><span>' + p.label + '</span>' +
    (o.pick ? '<i class="pick ' + o.pick + '"></i>' : '') + '</span>';
}
function cardName(card) {
  if (card === 'draw_four') return 'Wild +4';
  if (card === 'colorchooser') return 'Wild';
  var i = card.indexOf('_'), v = card.slice(i + 1);
  return (COLOR_NAMES[card.slice(0, i)] || '') + ' ' + ({ skip: 'skip', reverse: 'reverse', draw: '+2' }[v] || v);
}
var ORDER = { r: 0, y: 1, g: 2, b: 3, x: 4 };
function sortHand(cards) {
  return cards.slice().sort(function (x, y) {
    var a = parts(x), b = parts(y);
    return ORDER[a.color] - ORDER[b.color] || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0);
  });
}

// --- Rebuilding the game ----------------------------------------------------
function rebuild(events) {
  var deal = events[0], hands = {}, top = { c: deal.fc, color: deal.fc ? parts(deal.fc).color : null }, out = [], turnOf = deal.first;
  Object.keys(deal.h).forEach(function (p) { hands[p] = deal.h[p].slice(); });
  events.forEach(function (e, i) {
    var fresh = {};
    if (i > 0) {
      if (e.k === 'play') {
        var at = hands[e.p].indexOf(e.c);
        if (at >= 0) hands[e.p].splice(at, 1);
        top = { c: e.c, color: parts(e.c).color === 'x' ? null : parts(e.c).color };
      } else if (e.k === 'draw') {
        hands[e.p] = hands[e.p].concat(e.cs || []);
        fresh[e.p] = e.cs || [];
      } else if (e.k === 'color') {
        top = { c: top.c, color: e.co };
      }
    }
    var next = events[i + 1];
    if (next && next.p && next.k !== 'end') turnOf = next.p;
    var snap = { hands: {}, top: { c: top.c, color: top.color }, fresh: fresh, turn: turnOf };
    Object.keys(hands).forEach(function (p) { snap.hands[p] = hands[p].slice(); });
    out.push(snap);
  });
  return out;
}

function describe(e) {
  var who = '<i class="sw ' + e.p + '"></i>' + nm(e.p);
  switch (e.k) {
    case 'deal':
      return 'Cards dealt. First card ' + (e.fc ? chip(e.fc) : '–') + (e.first ? ', ' + nm(e.first) + ' starts.' : '.');
    case 'play':
      return who + ' played ' + chip(e.c) + (e.bl ? '<span class="tag">bluff</span>' : '') + (e.h === 1 ? '<span class="tag">UNO</span>' : '');
    case 'draw':
      var n = (e.cs || []).length;
      if (e.r === 'vol') return who + ' drew a card' + (e.ok ? '<span class="tag">playable</span>' : '');
      return who + ' drew ' + plural(n, 'card') + ' <span class="tag">' + (REASONS[e.r] || e.r) + '</span>';
    case 'pass':
      return who + ' passed';
    case 'color':
      return who + ' chose <i class="sw" style="background:var(--card-' + e.co + ')"></i>' + (COLOR_NAMES[e.co] || e.co) + (e.au ? '<span class="tag">picked by the bot</span>' : '');
    case 'chal':
      return who + ' challenged the +4 of ' + nm(e.vs) + ' <span class="tag">' + (e.ok ? 'bluff caught' : 'no bluff') + '</span>';
    case 'time':
      return who + ' ran out of time';
    case 'end':
      return '🏆 ' + who + (e.o === 'forfeit' ? ' won by forfeit' : ' won');
  }
  return esc(e.k);
}

// --- Rendering --------------------------------------------------------------
function show(step) {
  STEP = Math.max(0, Math.min(STATES.length - 1, step));
  var st = STATES[STEP], e = G.events[STEP];
  var col = st.top.color;
  $('top').innerHTML = st.top.c ? chip(st.top.c, { big: true, pick: parts(st.top.c).color === 'x' ? col : null }) : '';
  $('info').innerHTML = '<b>' + (e.k === 'end' ? 'Game over' : 'Turn ' + (e.n + 1)) + '</b>' +
    (col ? 'Color: <i class="sw" style="background:var(--card-' + col + ')"></i>' + COLOR_NAMES[col] + '<br>' : '') +
    clock(e.t) + ' into the game';
  ['a', 'b'].forEach(function (p) {
    var cards = st.hands[p] || [], fresh = (st.fresh[p] || []).slice();
    var html = sortHand(cards).map(function (card) {
      var i = fresh.indexOf(card);
      if (i >= 0) fresh.splice(i, 1);
      return chip(card, { fresh: i >= 0 });
    }).join('');
    $('hand-' + p).className = 'hand' + (st.turn === p && e.k !== 'end' ? ' turn' : '');
    $('hand-' + p).innerHTML = '<div class="hand-h"><b><i class="sw ' + p + '"></i>' + nm(p) + '</b><span class="cap">' + plural(cards.length, 'card') + '</span></div><div class="chips">' + (html || '<span class="cap">No cards left</span>') + '</div>';
  });
  $('slider').value = STEP;
  $('step').textContent = 'Step ' + (STEP + 1) + ' of ' + STATES.length;
  $('prev').disabled = $('first').disabled = STEP === 0;
  $('next').disabled = $('last').disabled = STEP === STATES.length - 1;
  var rows = $('timeline').children;
  for (var i = 0; i < rows.length; i++) rows[i].className = 'ev' + (i === STEP ? ' on' : i > STEP ? ' future' : '');
  var cur = rows[STEP];
  if (cur) {
    var box = $('timeline');
    if (cur.offsetTop < box.scrollTop || cur.offsetTop + cur.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = cur.offsetTop - box.clientHeight / 2;
  }
  drawChart();
  try { history.replaceState(null, '', '#' + G.id + (STEP ? '@' + STEP : '')); } catch (err) {}
}

function drawChart() {
  var node = $('chart'), W = Math.max(260, node.clientWidth || 600), H = 170, m = { l: 28, r: 10, t: 8, b: 20 };
  var iw = W - m.l - m.r, ih = H - m.t - m.b, n = STATES.length, max = 1;
  STATES.forEach(function (s) { ['a', 'b'].forEach(function (p) { max = Math.max(max, (s.hands[p] || []).length); }); });
  function X(i) { return m.l + (n > 1 ? i / (n - 1) : 0.5) * iw; }
  function Y(v) { return m.t + ih - v / max * ih; }
  var out = ['<svg width="' + W + '" height="' + H + '"><g class="ax">'];
  var step = max > 12 ? 5 : max > 6 ? 2 : 1;
  for (var v = 0; v <= max; v += step) out.push('<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (m.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + '</text>');
  var ends = [0, n - 1];
  ends.forEach(function (i) { out.push('<text x="' + X(i) + '" y="' + (H - 5) + '" text-anchor="' + (i ? 'end' : 'start') + '">' + clock(G.events[i].t) + '</text>'); });
  out.push('</g>');
  ['a', 'b'].forEach(function (p) {
    var d = STATES.map(function (s, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y((s.hands[p] || []).length).toFixed(1); }).join('');
    out.push('<path d="' + d + '" fill="none" stroke="var(--' + p + ')" stroke-width="2" stroke-linejoin="round"/>');
  });
  out.push('<line x1="' + X(STEP) + '" x2="' + X(STEP) + '" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="var(--ink2)"/>');
  ['a', 'b'].forEach(function (p) {
    out.push('<circle cx="' + X(STEP) + '" cy="' + Y((STATES[STEP].hands[p] || []).length) + '" r="4" fill="var(--' + p + ')" stroke="var(--surface)" stroke-width="2"/>');
  });
  out.push('<rect x="' + m.l + '" y="0" width="' + iw + '" height="' + (m.t + ih) + '" fill="transparent" style="cursor:pointer"/></svg>');
  node.innerHTML = out.join('');
  var svg = node.firstChild, tip = $('tip');
  function at(ev) { var r = svg.getBoundingClientRect(); return Math.round(Math.max(0, Math.min(1, (ev.clientX - r.left - m.l) / iw)) * (n - 1)); }
  svg.addEventListener('click', function (ev) { stop(); show(at(ev)); });
  svg.addEventListener('mousemove', function (ev) {
    var i = at(ev), s = STATES[i];
    tip.innerHTML = 'Step ' + (i + 1) + ' · ' + clock(G.events[i].t) + '<br><i class="sw a"></i>' + nm('a') + ' ' + (s.hands.a || []).length + ' · <i class="sw b"></i>' + nm('b') + ' ' + (s.hands.b || []).length;
    tip.style.display = 'block'; tip.style.left = (ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY + 12) + 'px';
  });
  svg.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
}

function renderStats() {
  var s = { a: {}, b: {} };
  ['a', 'b'].forEach(function (p) { s[p] = { played: 0, actions: 0, vol: 0, forced: 0, passes: 0, think: 0, n: 0, max: (G.events[0].h[p] || []).length, uno: 0 }; });
  var hands = { a: (G.events[0].h.a || []).length, b: (G.events[0].h.b || []).length };
  G.events.forEach(function (e) {
    var x = s[e.p];
    if (!x) return;
    if (e.th != null) { x.think += think(e); x.n++; }
    if (e.k === 'play') {
      x.played++;
      if (!/_\d$/.test(e.c)) x.actions++;
      if (e.h === 1 && hands[e.p] > 1) x.uno++;
      hands[e.p] = e.h;
    } else if (e.k === 'draw') {
      if (e.r === 'vol') x.vol++; else x.forced += (e.cs || []).length;
      hands[e.p] = e.h;
      x.max = Math.max(x.max, e.h);
    } else if (e.k === 'pass') x.passes++;
  });
  var rows = [['Cards played', 'played'], ['Action and wild cards', 'actions'], ['Chosen draws', 'vol'], ['Penalty cards drawn', 'forced'], ['Passes', 'passes'], ['Largest hand', 'max'], ['Times on one card', 'uno']];
  $('stats').innerHTML = '<tr><th></th><th class="num"><i class="sw a"></i>' + nm('a') + '</th><th class="num"><i class="sw b"></i>' + nm('b') + '</th></tr>' +
    rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="num">' + s.a[r[1]] + '</td><td class="num">' + s.b[r[1]] + '</td></tr>'; }).join('') +
    '<tr><td>Thinking time per move</td><td class="num">' + (s.a.n ? (s.a.think / s.a.n).toFixed(1) + 's' : '–') + '</td><td class="num">' + (s.b.n ? (s.b.think / s.b.n).toFixed(1) + 's' : '–') + '</td></tr>';
}

function renderGame(data, id, step) {
  G = data; G.id = id;
  ['a', 'b'].forEach(function (p) {
    if (G.colors && /^#[0-9a-fA-F]{6}$/.test(G.colors[p] || '')) document.documentElement.style.setProperty('--' + p, G.colors[p]);
  });
  STATES = rebuild(G.events);
  var end = G.events[G.events.length - 1], ms = end.t;
  document.title = 'Game #' + G.n + ' · ' + G.players.a + ' vs ' + G.players.b + ' · UNO Replay';
  $('title').textContent = 'Game #' + G.n + ': ' + G.players.a + ' vs ' + G.players.b;
  $('subtitle').textContent = fmtStamp(G.started_at || G.ended_at) + (G.mode ? ' · ' + G.mode + ' mode' : '') + (G.players_count > 2 ? ' · ' + G.players_count + ' players' : '');
  var winner = G.winner;
  $('summary').innerHTML = [
    ['<i class="sw ' + winner + '"></i>' + nm(winner), G.outcome === 'forfeit' ? 'won by forfeit' : 'won'],
    [fmtDur(ms), 'length'],
    [end.n, 'turns'],
    [G.events.length, 'logged moves']
  ].map(function (x) { return '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join('');
  $('timeline').innerHTML = G.events.map(function (e, i) {
    var th = think(e);
    return '<div class="ev" data-i="' + i + '"><span class="tm">' + clock(e.t) + '</span><span class="tx">' + describe(e) + (th != null ? '<span class="th">' + th.toFixed(1) + 's</span>' : '') + '</span></div>';
  }).join('');
  $('moves-cap').textContent = plural(G.events.length, 'move');
  $('slider').max = STATES.length - 1;
  renderStats();
  checkFairness(G);
  renderNav(id);
  $('msg').style.display = 'none'; $('list').style.display = 'none'; $('game').style.display = '';
  show(step == null ? 0 : step);
}

function renderNav(id) {
  var i = LIST.map(function (m) { return String(m.g); }).indexOf(String(id));
  if (i < 0) { $('nav-games').innerHTML = ''; return; }
  var prev = LIST[i - 1], next = LIST[i + 1];
  $('nav-games').innerHTML = (prev ? '<a class="btn" href="#' + prev.g + '">← Game #' + prev.n + '</a> ' : '') + '<a class="btn" href="#">All replays</a>' + (next ? ' <a class="btn" href="#' + next.g + '">Game #' + next.n + ' →</a>' : '');
}

function renderList() {
  stop();
  G = null;
  document.title = 'UNO Replays';
  $('title').textContent = 'Replays';
  $('nav-games').innerHTML = '';
  if (!LIST.length) {
    $('subtitle').textContent = '';
    $('msg').textContent = 'No replays yet. The bot logs every game the two rivals play with it from now on.';
    $('msg').style.display = ''; $('list').style.display = 'none'; $('game').style.display = 'none';
    return;
  }
  var names = window.__scores ? window.__scores.players : { a: 'A', b: 'B' };
  $('subtitle').textContent = plural(LIST.length, 'game') + ' logged turn by turn';
  $('list-table').innerHTML = '<tr><th class="num">#</th><th>Ended</th><th>Season</th><th>Winner</th><th class="num">Length</th><th class="num">Turns</th><th class="num">Loser\'s cards</th><th></th></tr>' +
    LIST.slice().reverse().map(function (m) {
      var len = m.d && m.d.ms ? fmtDur(m.d.ms) : '–';
      return '<tr><td class="num">' + m.n + '</td><td>' + fmtStamp(m.ended_at) + '</td><td>' + esc(m.season) + '</td><td><i class="sw ' + m.winner + '"></i>' + esc(names[m.winner]) + '</td>' +
        '<td class="num">' + len + '</td><td class="num">' + (m.turns || '–') + '</td><td class="num">' + (m.loser_cards_left != null ? m.loser_cards_left : '–') + '</td>' +
        '<td><a href="#' + m.g + '">▶ Watch</a></td></tr>';
    }).join('');
  $('msg').style.display = 'none'; $('game').style.display = 'none'; $('list').style.display = '';
}

// --- Playback ---------------------------------------------------------------
function stop() { if (TIMER) { clearInterval(TIMER); TIMER = null; } $('play').textContent = '▶ Play'; }
function play() {
  if (TIMER) { stop(); return; }
  if (STEP >= STATES.length - 1) show(0);
  $('play').textContent = '❚❚ Pause';
  TIMER = setInterval(function () {
    if (STEP >= STATES.length - 1) { stop(); return; }
    show(STEP + 1);
  }, +$('speed').value);
}
$('play').addEventListener('click', play);
$('first').addEventListener('click', function () { stop(); show(0); });
$('last').addEventListener('click', function () { stop(); show(STATES.length - 1); });
$('prev').addEventListener('click', function () { stop(); show(STEP - 1); });
$('next').addEventListener('click', function () { stop(); show(STEP + 1); });
$('speed').addEventListener('change', function () { if (TIMER) { stop(); play(); } });
$('slider').addEventListener('input', function () { stop(); show(+this.value); });
$('timeline').addEventListener('click', function (ev) {
  var row = ev.target.closest ? ev.target.closest('.ev') : null;
  if (row) { stop(); show(+row.getAttribute('data-i')); }
});
document.addEventListener('keydown', function (ev) {
  if (!G || /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName) && ev.target.type !== 'range') return;
  if (ev.key === 'ArrowRight') { stop(); show(STEP + 1); ev.preventDefault(); }
  else if (ev.key === 'ArrowLeft') { stop(); show(STEP - 1); ev.preventDefault(); }
  else if (ev.key === 'Home') { stop(); show(0); ev.preventDefault(); }
  else if (ev.key === 'End') { stop(); show(STATES.length - 1); ev.preventDefault(); }
  else if (ev.key === ' ') { play(); ev.preventDefault(); }
});
var lastW = window.innerWidth;
window.addEventListener('resize', function () { if (G && window.innerWidth !== lastW) { lastW = window.innerWidth; drawChart(); } });

// --- Fairness check -----------------------------------------------------------
// The checker itself is in fair.js (shared with index.html); this shows its steps.
// A seat in the proof: a rival's key ("a"/"b") or another player's first name
function seatName(seat) { return G && G.players && G.players[seat] ? G.players[seat] : seat; }
function fmtTime(unix) { return fmtDate(unix * 1000, true); }
FairNames.card = function (card) { return cardName(card); };
FairNames.seat = seatName;

function hex64(v) { var h = v.toString(16); return '0000000000000000'.slice(h.length) + h; }

// The "Show the math" section: one row per random pick, built when it is opened
function renderMath(proof, entropyLabel) {
  var steps = (proof._steps || []).filter(function (s) { return s.kind === 'd' || s.kind === 'c' || s.kind === 's'; });
  var el = document.createElement('details');
  el.className = 'math';
  el.innerHTML = '<summary>Show the math behind every card (' + plural(steps.length, 'random pick') + ')</summary>' +
    '<div class="how">Each pick takes the next block of <code>HMAC-SHA256(seed, "uno-fair-v1" ‖ ' + esc(entropyLabel) +
    ' ‖ block number)</code> and reads its first 8 bytes as a 64-bit number. It keeps only the lowest bits (the smallest ' +
    'power of two that covers the pile) and tries the next block if the result is too big, so every card is equally likely. ' +
    'The result is a position in the remaining cards sorted by name.</div><div class="tbl"></div>';
  el.addEventListener('toggle', function () {
    if (!el.open || el.getAttribute('data-built')) return;
    el.setAttribute('data-built', '1');
    var rows = steps.map(function (s, n) {
      var what, who, pick, picks = s.picks || [];
      if (s.kind === 'd') {
        what = chip(s.op[1]);
        who = s.op.length > 2 && s.op[2] != null ? esc(seatName(s.op[2])) : '<span class="rej">first card</span>';
        pick = (picks[0] ? picks[0].result + 1 : 1) + ' of ' + s.pile + (s.recycled ? ' <span class="rej">(discards reshuffled)</span>' : '');
      } else if (s.kind === 'c') {
        what = esc(COLOR_NAMES[s.op[1]] || s.op[1]);
        who = '<span class="rej">color the bot picked</span>';
        pick = (picks[0] ? picks[0].result + 1 : 1) + ' of 4';
      } else {
        what = 'Seating';
        who = esc(s.op[2].map(seatName).join(' → '));
        pick = plural(picks.length, 'swap');
      }
      var blocks = picks.map(function (p) {
        return p.tries.map(function (t, k) {
          var last = k === p.tries.length - 1;
          return '<div' + (last ? '' : ' class="rej"') + '>#' + t.block + ' <code title="' + hex64(t.raw) + '">' + hex64(t.raw).slice(0, 8) + '…</code> &amp; ' +
            p.mask + ' = ' + t.v + (last ? '' : ' ≥ ' + p.n + ', retry') + '</div>';
        }).join('');
      }).join('');
      return '<tr><td class="num">' + (n + 1) + '</td><td>' + what + '</td><td>' + who + '</td><td class="num">' + pick + '</td><td>' + (blocks || '–') + '</td></tr>';
    });
    el.querySelector('.tbl').innerHTML = '<table><tr><th class="num">#</th><th>Card</th><th>To</th><th class="num">Position</th><th>Block · value · masked</th></tr>' + rows.join('') + '</table>';
  });
  return el;
}

async function checkFairness(game) {
  var list = $('fair'), cap = $('fair-cap'), rows = [];
  var old = list.parentNode.querySelector('details.math');
  if (old) old.remove();
  function render(verdict, cls) {
    list.innerHTML = rows.map(function (r) {
      var mark = r[0] === true ? '<span class="mk ok">✓</span>' : r[0] === false ? '<span class="mk bad">✗</span>'
        : r[0] === 'warn' ? '<span class="mk wait">!</span>' : '<span class="mk wait">…</span>';
      return '<li>' + mark + '<div>' + r[1] + (r[2] ? '<div class="dt">' + r[2] + '</div>' : '') + '</div></li>';
    }).join('');
    cap.innerHTML = verdict ? '<span class="' + cls + '">' + verdict + '</span>' : '';
  }
  function add(ok, text, detail) { rows.push([ok, text, detail]); render(); }
  function done(ok) { render(ok ? 'Every card checks out' : 'Check failed', ok ? 'verdict-ok' : 'verdict-bad'); }

  var p = game.proof;
  if (!p) {
    add(null, 'No fairness proof for this game.', 'Games played before the bot published proofs have none; for newer games it appears once the whole game is over.');
    render('Not available', ''); return;
  }
  var source = p.source || (p.verifiable ? 'drand' : 'system');
  if (!p.verifiable || source === 'system') {
    add(false, 'This game\'s cards came from the server\'s own random generator, because drand couldn\'t be reached and not every player sent a seed.', 'This game can\'t be checked.');
    render('Not verifiable', 'verdict-bad'); return;
  }
  if (!window.crypto || !crypto.subtle || typeof BigInt === 'undefined') {
    add(null, 'This browser can\'t run the check (it needs Web Crypto and BigInt).'); render('Not available', ''); return;
  }
  try {
    var hash = await sha256Hex(hexBytes(p.seed));
    var committed = hash === p.commit;
    add(committed, committed ? 'The revealed seed matches the fingerprint posted when the lobby opened.' : 'The revealed seed does not match the posted fingerprint.',
      'Fingerprint ' + p.commit + (p.committed_at ? ' · lobby opened ' + fmtTime(p.committed_at) : ''));
    if (!committed) { done(false); return; }

    var entropy;
    if (source === 'drand') {
      var published = roundTime(p.round);
      if (p.anchor && p.anchor.date) {
        var after = published > p.anchor.date + 1;
        add(after, after ? 'drand round ' + p.round + ' came out after the bot announced it, so nobody could know its value when the game was locked in.'
          : 'drand round ' + p.round + ' was already out when the bot announced it.',
          'Announced in the chat ' + fmtTime(p.anchor.date) + ' (Telegram\'s timestamp) · round published ' + fmtTime(published) +
          '. You can compare with the "🎲 Starting!" message in the chat.');
        if (!after) { done(false); return; }
      } else if (p.v < 2) {
        var before = p.committed_at == null || p.committed_at < published;
        add(before, before ? 'drand round ' + p.round + ' was published after the commitment.' : 'The drand round was already published when the seed was fixed.',
          'Round published ' + fmtTime(published) + (p.committed_at ? ' · committed ' + fmtTime(p.committed_at) : '') + '.');
        if (!before) { done(false); return; }
      } else {
        add('warn', 'The bot couldn\'t post the drand round in the chat before using it, so the order of the round and the start rests on the server\'s clock.',
          'Round published ' + fmtTime(published) + '.');
      }
      add(null, 'Fetching drand round ' + p.round + '…');
      var beacon = await fetchBeacon(p.chain, p.round);
      rows.pop();
      if (!beacon) { add(null, 'Couldn\'t reach drand to fetch round ' + p.round + '. Try again later.'); render('Incomplete', ''); return; }
      var same = !p.beacon || p.beacon === beacon.randomness;
      add(same, same ? 'Fetched drand round ' + p.round + ' directly from drand; it matches what the bot used.' : 'The bot used a different value than drand published for that round.',
        beacon.randomness + ' · ' + beacon.from);
      if (!same) { done(false); return; }
      entropy = beacon.randomness;
    } else {
      entropy = await playersEntropy(p.player_seeds || []);
      add(true, 'drand couldn\'t be reached, so the players\' seeds were used instead. The fingerprint was posted before anyone sent one.',
        (p.player_seeds || []).map(function (s) { return esc(seatName(s[0])) + ': “' + esc(s[1]) + '”'; }).join(' · ') +
        '. Check that your own text is listed.');
    }

    var stream = await fairStream(p.seed, entropy);
    var problem = await replayOps(p, stream);
    add(!problem, problem ? 'A card doesn\'t match: ' + esc(problem) + '.' : 'All ' + p._draws.length + ' cards dealt and drawn, the seating and every color the bot picked follow from the seed and ' +
      (source === 'drand' ? 'the drand round.' : 'the players\' seeds.'), problem ? null : plural(p.ops.length, 'logged step') + ' replayed.');
    if (problem) { done(false); return; }

    var mismatch = replayMatchesProof(game.events, p);
    add(!mismatch, mismatch ? 'This replay doesn\'t match the proof: ' + esc(mismatch) + '.'
      : (p.v < 2 ? 'The cards in this replay are among the ones the proof dealt.' : 'Each player got exactly the cards the seed gave their seat, in order.'));
    done(!mismatch);
    list.parentNode.appendChild(renderMath(p, source === 'drand' ? 'drand round ' + p.round : 'the players\' seeds hash'));
  } catch (e) {
    rows.push([false, 'The check could not run: ' + esc(e.message || e)]);
    done(false);
  }
}

// --- Loading ----------------------------------------------------------------
function getJSON(url, cb) {
  fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(cb, function () { cb(null); });
}
function route() {
  var h = location.hash.replace(/^#/, ''), m = /^(\d+)(?:@(\d+))?$/.exec(h);
  if (!m) { renderList(); return; }
  if (G && String(G.id) === m[1]) return;
  stop();
  $('msg').textContent = 'Loading game…'; $('msg').style.display = '';
  getJSON('games/' + m[1] + '.json', function (data) {
    if (!data || !data.events) { $('msg').textContent = 'This replay could not be loaded.'; $('game').style.display = 'none'; return; }
    renderGame(data, m[1], m[2] ? +m[2] : null);
  });
}
window.addEventListener('hashchange', route);
getJSON('scores.json', function (d) {
  window.__scores = d;
  LIST = d && d.matches ? d.matches.filter(function (m) { return m.g; }) : [];
  route();
});
})();
</script>
</body>
</html>
